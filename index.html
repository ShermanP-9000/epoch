<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EPOCH</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1110;
        --fg: #ece7dc;
        --muted: #9aa08c;
        --line: #2a322c;
        --accent: #c4b48a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Georgia, "Times New Roman", serif; overflow: hidden; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
      #hud { position: absolute; inset: 0; pointer-events: none; }
      #hud > * { pointer-events: auto; }
      .bar {
        position: absolute; top: 12px; left: 12px; right: 12px;
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      }
      .title { font-size: 22px; letter-spacing: 0.18em; margin: 0; }
      .stat { font-size: 13px; color: var(--muted); }
      button {
        background: #1a211c; color: var(--fg); border: 1px solid var(--line);
        padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px;
      }
      button.active { border-color: var(--accent); color: var(--accent); }
      #log {
        position: absolute; top: 52px; left: 12px; max-width: min(42vw, 22rem);
        font-size: 13px; color: #fff; text-shadow: 0 1px 2px #000; line-height: 1.35;
      }
      #map {
        position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
        width: min(80vw, 34rem); height: 64px; border: 1px solid var(--line);
        border-radius: 8px; cursor: grab; background: #0b0e0c; touch-action: none;
      }
      #start {
        position: absolute; inset: 0; display: grid; place-items: center;
        background: linear-gradient(#0e1110ee, #0e1110);
      }
      #start h1 { letter-spacing: 0.28em; margin: 0 0 8px; }
      #start p { color: var(--muted); max-width: 26rem; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="bar">
        <h1 class="title">EPOCH</h1>
        <span id="meta" class="stat">Year 0 · Paleolithic</span>
        <button data-speed="1">1×</button>
        <button data-speed="2" class="active">2×</button>
        <button data-speed="4">4×</button>
        <button data-speed="8">8×</button>
        <button data-speed="16">16×</button>
        <button id="pause">Pause</button>
        <button id="follow">Follow</button>
        <button id="seed">New land</button>
      </div>
      <div id="log"></div>
      <canvas id="map" aria-label="World map"></canvas>
    </div>
    <div id="start">
      <div>
        <h1>EPOCH</h1>
        <p>A watch-only block world. People raise houses, cut wood, farm, and dig. The land keeps the layers they leave behind.</p>
        <p style="margin-top:16px"><button id="watch">Watch the land</button></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
